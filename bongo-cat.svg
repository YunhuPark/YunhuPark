<svg width="80" height="52" viewBox="0 0 120 78" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .paw-l { animation: tapL 0.18s infinite alternate steps(2); }
    .paw-r { animation: tapR 0.18s infinite alternate-reverse steps(2); }
    .head { animation: bob 0.36s infinite alternate ease-in-out; }
    @keyframes tapL {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    @keyframes tapR {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-6px); }
    }
    @keyframes bob {
      0% { transform: translateY(0px); }
      100% { transform: translateY(1.5px); }
    }
  </style>

  <!-- 책상 라인 -->
  <path d="M12 58 L108 66" stroke="#24292f" stroke-width="3.2" stroke-linecap="round" />

  <!-- 고양이 머리 & 귀 -->
  <g class="head">
    <path d="M36 58 C34 38, 38 28, 42 16 L52 28 C58 27, 64 27, 70 28 L80 16 C84 28, 88 38, 86 62" fill="#ffffff" stroke="#24292f" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />
    <!-- 수염 -->
    <path d="M26 36 L37 38 M25 43 L36 43 M94 40 L83 41 M95 47 L84 46" stroke="#24292f" stroke-width="2.6" stroke-linecap="round" />
    <!-- 눈 -->
    <circle cx="51" cy="39" r="2.6" fill="#24292f" />
    <circle cx="71" cy="40" r="2.6" fill="#24292f" />
    <!-- 볼터치 -->
    <ellipse cx="44" cy="43" rx="3.5" ry="2" fill="#fda4af" />
    <ellipse cx="78" cy="44" rx="3.5" ry="2" fill="#fda4af" />
    <!-- 입 (ω) -->
    <path d="M57 42 Q59 45 61 42 Q63 45 65 42" stroke="#24292f" stroke-width="2.4" fill="none" stroke-linecap="round" />
  </g>

  <!-- 타닥타닥 앞발 -->
  <g class="paw-l">
    <path d="M34 59 C32 49, 44 49, 44 60" fill="#ffffff" stroke="#24292f" stroke-width="3.2" stroke-linecap="round" />
  </g>
  <g class="paw-r">
    <path d="M76 62 C76 52, 88 53, 86 64" fill="#ffffff" stroke="#24292f" stroke-width="3.2" stroke-linecap="round" />
  </g>
</svg>
